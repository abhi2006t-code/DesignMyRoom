<style>

header{grid-area:h;display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap}
header b{font:700 17px Georgia,serif;margin-right:4px}.pill{padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--bd)}
button,select,input{font:inherit;color:var(--tx)}

#e input[type=color]{width:100%;height:30px;padding:0;border:1px solid var(--bd);background:none}
#sel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:none;gap:4px;flex-wrap:wrap;justify-content:center;max-width:96%;background:var(--pn);padding:6px;border-radius:12px;border:1px solid var(--bd)}

.mt{display:none;gap:4px}

/* rating */
function rate(){const n=items.length;if(!n)return toast("Add some furniture first");
const cats=new Set(items.map(g=>g.userData.d.c)).size,ids=new Set(items.map(g=>g.userData.id)).size,cnt=s=>items.filter(g=>g.userData.d.s==s).length;
const tg=st.theme||(cnt("boy")>cnt("girl")?"boy":cnt("girl")>cnt("boy")?"girl":"mix");
const cr=Math.min(25,Math.round(cats*3+ids*1.5)),th=Math.round(25*items.filter(g=>g.userData.d.s==tg||(tg!="mix"&&g.userData.d.s=="mix")).length/n);
let ar=items.some(g=>g.userData.id=="bed")?8:0;const used=items.filter(solid).reduce((s,g)=>{const z=fp(g).getSize(new T.Vector3());return s+z.x*z.z},0)/(st.w*st.d);ar+=used>.12&&used<.6?17:used<.8?10:4;
const bg=st.budget?(st.coins<0?0:n>3?Math.round(25*(1-.8*st.coins/st.budget)):5):25,tot=cr+th+ar+bg,stars=Math.max(1,Math.ceil(tot/20));
modal(`<h3>${"★".repeat(stars)}${"☆".repeat(5-stars)} ${tot} / 100</h3><p>Creativity: <b>${cr}</b> / 25<br>Theme consistency (${{boy:"boys’",girl:"girls’",mix:"neutral"}[tg]}): <b>${th}</b> / 25<br>Furniture arrangement: <b>${ar}</b> / 25<br>Budget use: <b>${bg}</b> / 25</p><p>${tot>80?"A showroom-worthy room.":tot>55?"Nice start. Mix more categories or tidy the layout to score higher.":"Keep decorating. Add a bed, lighting and wall art."}</p>`)}
